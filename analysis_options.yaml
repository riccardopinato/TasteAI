analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - sort_constructors_first
    - use_super_parameters
